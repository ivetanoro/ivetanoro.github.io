<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>la paradeta · ivetanoro</title>
<meta name="description" content="Les eines que fa l’Ivet Anoro (@ivetanoro), perquè les provis.">
<meta property="og:title" content="la paradeta · ivetanoro">
<meta property="og:description" content="Les eines que faig, perquè les provis. De moment, totes gratis.">
<meta property="og:image" content="https://ivetanoro.github.io/img/equilibri.jpg">
<meta name="theme-color" content="#FBF6D1">
<link rel="preload" href="fonts/Bitroad-Regular.woff2" as="font" type="font/woff2" crossorigin>
<style>
  @font-face { font-family:"Bitroad"; src:url("fonts/Bitroad-Regular.woff2") format("woff2"); font-display:swap; }
  @font-face { font-family:"BitroadMono"; src:url("fonts/BitroadMono-Regular.woff2") format("woff2"); font-display:swap; }
  :root {
    --butter:#FBF6D1; --card:#FFFBE6; --blue:#ACCAE6; --blue-soft:#CFE0F0; --ox:#4C050C; --esp:#2F1B11;
    --muted:rgba(47,27,17,.74); --line:rgba(47,27,17,.16); --rule:var(--esp);
    --sans:"Helvetica Neue", Helvetica, Arial, sans-serif;
    --mono:"BitroadMono", "SF Mono", ui-monospace, monospace;
    --display:"Bitroad", "Helvetica Neue", Helvetica, sans-serif;
  }
  * { box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  body { margin:0; background:var(--butter); color:var(--esp); font-family:var(--sans); font-size:16px; line-height:1.5; }
  a { color:inherit; }

  /* barra de dalt (de la B) */
  .bar { display:grid; grid-template-columns:1.3fr 1fr 1fr; border-bottom:2px solid var(--rule);
         font-family:var(--mono); font-size:11px; letter-spacing:.02em; text-transform:uppercase;
         padding-top:env(safe-area-inset-top, 0px); }
  .bar > * { padding:12px 16px; border-right:1px solid var(--rule); text-decoration:none; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .bar > :last-child { border-right:0; text-align:right; }

  .wrap { max-width:560px; margin:0 auto; padding:0 max(16px, env(safe-area-inset-left, 0px)) 48px; }

  .hero { padding:36px 0 28px; }
  h1 { font-family:var(--sans); font-weight:700; font-size:clamp(54px, 16vw, 84px); line-height:.88; letter-spacing:-.045em; margin:0; }
  .lema { margin:18px 0 0; font-size:17px; line-height:1.4; color:var(--muted); max-width:30ch; }

  /* targetes (de la A) */
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  .card + .card { margin-top:14px; }
  .lab { display:flex; justify-content:space-between; gap:12px; background:var(--ox); color:var(--butter);
         font-family:var(--mono); font-size:11px; text-transform:uppercase; letter-spacing:.03em; padding:8px 14px; }
  .card .img { display:block; aspect-ratio:5/4; overflow:hidden; border-bottom:1px solid var(--line); }
  .card .img img { display:block; width:100%; height:100%; object-fit:cover; object-position:50% 38%; }
  .body { padding:18px 16px 16px; }
  h3 { font-size:21px; line-height:1.15; letter-spacing:-.02em; margin:0 0 6px; }
  .big h3 { font-size:25px; }
  .frase { margin:0; font-size:15px; line-height:1.45; color:var(--muted); }

  .fila { display:grid; grid-template-columns:76px 1fr; gap:14px; padding:16px 16px 0; }
  .rajola { display:flex; align-items:flex-end; aspect-ratio:1; border-radius:8px; padding:8px; text-decoration:none;
            font-family:var(--display); font-size:24px; line-height:.9; }
  .rajola.oxblood { background:var(--ox); color:var(--butter); }
  .rajola.espresso { background:var(--esp); color:var(--butter); }
  .rajola.blue { background:var(--blue); color:var(--esp); }
  .num { font-family:var(--mono); font-size:11px; margin:0 0 4px; color:var(--muted); }

  /* la fitxa cal / on / dura (de la B) */
  .fitxa { display:grid; grid-template-columns:repeat(3, 1fr); margin:16px 0 0; border-top:1px solid var(--rule); border-bottom:1px solid var(--rule); }
  .fila + .fitxa { margin:16px 16px 0; }
  .fitxa > div { padding:8px 10px 9px; border-right:1px solid var(--rule); min-width:0; }
  .fitxa > div:first-child { padding-left:0; }
  .fitxa > div:last-child { border-right:0; }
  .fitxa dt { font-family:var(--mono); font-size:10px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); }
  .fitxa dd { margin:2px 0 0; font-size:14px; font-weight:700; line-height:1.25; overflow-wrap:anywhere; }

  .accions { display:flex; flex-wrap:wrap; align-items:center; gap:10px 18px; margin-top:14px; }
  .fitxa + .accions { padding:0 16px 16px; }
  .body .accions { margin-top:16px; }
  .btn { display:inline-flex; align-items:center; justify-content:space-between; gap:14px; min-height:48px;
         background:var(--ox); color:var(--butter); text-decoration:none; font-weight:700; font-size:16px;
         padding:12px 16px; border-radius:6px; transition:background .2s, transform .1s; }
  .btn:hover { background:#6a0a14; }
  .btn:active { transform:scale(.98); }
  .btn svg { flex:none; }
  .big .btn { width:100%; }
  .btn.clar { background:transparent; color:var(--esp); border:1.5px solid var(--esp); }
  .btn.clar:hover { background:rgba(47,27,17,.06); }
  .link { font-size:15px; text-underline-offset:3px; }
  a:focus-visible { outline:2px solid var(--ox); outline-offset:3px; }

  /* títols de secció */
  .sec { display:flex; justify-content:space-between; align-items:baseline; margin:40px 0 14px; padding-bottom:8px;
         border-bottom:2px solid var(--rule); font-family:var(--mono); font-weight:400; font-size:12px; text-transform:uppercase; letter-spacing:.03em; }

  /* aviat: difuminades */
  .aviat { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .soon { position:relative; border:1px solid var(--line); border-radius:12px; overflow:hidden; padding:14px; min-height:132px;
          background:repeating-linear-gradient(-45deg, transparent 0 7px, rgba(47,27,17,.07) 7px 8px), var(--blue-soft); }
  .soon.ample { grid-column:1 / -1; min-height:0; }
  .soon .boira { filter:blur(5px); user-select:none; }
  .soon h3 { font-family:var(--display); font-weight:400; font-size:26px; line-height:.9; margin:22px 0 8px; }
  .soon p { margin:0; font-size:14px; line-height:1.35; }
  .segell { position:absolute; top:10px; left:10px; z-index:1; font-family:var(--mono); font-size:10px; text-transform:uppercase;
            letter-spacing:.04em; background:var(--esp); color:var(--butter); padding:4px 7px; border-radius:3px; }
  .soon .btn { position:relative; z-index:1; margin-top:14px; }

  footer { max-width:560px; margin:0 auto; padding:16px max(16px, env(safe-area-inset-left, 0px)) calc(32px + env(safe-area-inset-bottom, 0px));
           border-top:2px solid var(--rule); display:flex; justify-content:space-between; font-family:var(--mono); font-size:11px; text-transform:uppercase; }
  footer a { text-decoration:none; }

  @media (prefers-reduced-motion: no-preference) {
    .js .reveal { opacity:0; transform:translateY(12px); transition:opacity .6s cubic-bezier(.16,1,.3,1), transform .6s cubic-bezier(.16,1,.3,1);
                  transition-delay:calc(var(--i, 0) * 80ms); }
    .js .reveal.in { opacity:1; transform:none; }
  }
</style>
</head>
<body>
<header class="bar">
  <a id="insta" href="#">@ivetanoro</a>
  <span id="compte"></span>
  <span id="data"></span>
</header>
<main class="wrap">
  <section class="hero">
    <h1 id="nom"></h1>
    <p class="lema" id="lema"></p>
  </section>
  <div id="destacada"></div>
  <h2 class="sec"><span>eines</span><span id="rang"></span></h2>
  <div id="eines"></div>
  <h2 class="sec"><span>aviat</span><span>a punt de sortir</span></h2>
  <div class="aviat" id="aviat"></div>
</main>
<footer><a id="insta2" href="#">@ivetanoro</a><span id="peu"></span></footer>

<script src="cataleg.js"></script>
<script>
document.documentElement.classList.add("js");
const P = window.PARADETA, EINES = window.EINES, AVIAT = window.AVIAT;
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
const n2 = i => String(i).padStart(2, "0");
const fletxa = `<svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true"><path d="M3 9h11M10 4.5 14.5 9 10 13.5" stroke="currentColor" stroke-width="2"/></svg>`;

document.getElementById("nom").textContent = P.nom;
document.getElementById("lema").textContent = P.lema;
document.getElementById("compte").textContent = `${n2(EINES.length)} eines`;
document.getElementById("data").textContent = P.actualitzat;
document.getElementById("peu").textContent = `${P.nom} · ${new Date().getFullYear()}`;
for (const id of ["insta", "insta2"]) document.getElementById(id).href = P.instagram;

const fitxa = f => `<dl class="fitxa">${f.map(([k, v]) => `<div><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join("")}</dl>`;
const accions = e => {
  const b = [];
  if (e.preu && e.stripe) b.push(`<a class="btn" href="${esc(e.stripe)}"><span>compra-la · ${esc(e.preu)}</span>${fletxa}</a>`);
  b.push(`<a class="btn${e.preu && e.stripe ? " clar" : ""}" href="${esc(e.boto.url)}"><span>${esc(e.boto.text)}</span>${fletxa}</a>`);
  if (e.enllac2) b.push(`<a class="link" href="${esc(e.enllac2.url)}">${esc(e.enllac2.text)}</a>`);
  return `<div class="accions">${b.join("")}</div>`;
};

let num = 0;
const dest = EINES.find(e => e.destacada), resta = EINES.filter(e => e !== dest);
if (dest) {
  num++;
  document.getElementById("destacada").innerHTML = `
    <article class="card big reveal">
      <div class="lab"><span>${n2(num)}</span><span>${esc(dest.etiqueta || "")}</span></div>
      <a class="img" href="${esc(dest.boto.url)}" tabindex="-1" aria-hidden="true"><img src="${esc(dest.imatge)}" alt="" width="900" height="1125"></a>
      <div class="body">
        <h3>${esc(dest.titol)}</h3>
        <p class="frase">${esc(dest.frase)}</p>
        ${fitxa(dest.fitxa)}
        ${accions(dest)}
      </div>
    </article>`;
}
document.getElementById("rang").textContent = resta.length ? `${n2(num + 1)}–${n2(num + resta.length)}` : "";
document.getElementById("eines").innerHTML = resta.map((e, i) => {
  num++;
  const r = e.rajola || {};
  const vis = e.imatge
    ? `<a class="rajola" href="${esc(e.boto.url)}" tabindex="-1" aria-hidden="true" style="padding:0;overflow:hidden"><img src="${esc(e.imatge)}" alt="" style="width:100%;height:100%;object-fit:cover"></a>`
    : `<a class="rajola ${esc(r.fons || "blue")}" href="${esc(e.boto.url)}" tabindex="-1" aria-hidden="true">${esc(r.text || "")}</a>`;
  return `
    <article class="card reveal" style="--i:${i}">
      <div class="fila">${vis}<div><p class="num">${n2(num)}</p><h3>${esc(e.titol)}</h3><p class="frase">${esc(e.frase)}</p></div></div>
      ${fitxa(e.fitxa)}
      ${accions(e)}
    </article>`;
}).join("");

const ordreAviat = [...AVIAT.filter(a => a.llista), ...AVIAT.filter(a => !a.llista)];
document.getElementById("aviat").innerHTML = ordreAviat.map((a, i) => `
  <article class="soon reveal${a.llista ? " ample" : ""}" style="--i:${i}">
    <span class="segell">aviat</span>
    <div class="boira"><h3>${esc(a.titol)}</h3><p>${esc(a.frase)}</p></div>
    ${a.llista ? `<a class="btn clar" href="${esc(a.llista.url)}"><span>${esc(a.llista.text)}</span>${fletxa}</a>` : ""}
  </article>`).join("");

if ("IntersectionObserver" in window) {
  const io = new IntersectionObserver(es => es.forEach(x => { if (x.isIntersecting) { x.target.classList.add("in"); io.unobserve(x.target); } }), { rootMargin:"0px 0px -8% 0px" });
  document.querySelectorAll(".reveal").forEach(el => io.observe(el));
} else document.querySelectorAll(".reveal").forEach(el => el.classList.add("in"));
</script>
</body>
</html>
