<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>la paradeta · ivetanoro</title>
<meta name="description" content="Les eines que fa l’Ivet Anoro (@ivetanoro), perquè les provis.">
<meta property="og:title" content="la paradeta · ivetanoro">
<meta property="og:description" content="Les eines que faig, perquè les provis. De moment, totes gratis.">
<meta property="og:image" content="https://ivetanoro.github.io/img/equilibri.jpg">
<meta name="theme-color" content="#FBF6D1">
<link rel="preload" href="fonts/BitroadMono-Regular.woff2" as="font" type="font/woff2" crossorigin>
<style>
  @font-face { font-family:"Bitroad"; src:url("fonts/Bitroad-Regular.woff2") format("woff2"); font-display:swap; }
  @font-face { font-family:"BitroadMono"; src:url("fonts/BitroadMono-Regular.woff2") format("woff2"); font-display:swap; }
  :root {
    --butter:#FBF6D1; --paper:#FFFDF2; --blue:#ACCAE6; --blue-soft:#CFE0F0; --ox:#4C050C; --esp:#2F1B11;
    --muted:rgba(47,27,17,.74); --line:rgba(47,27,17,.16);
    --sans:"Helvetica Neue", Helvetica, Arial, sans-serif;
    --mono:"BitroadMono", "SF Mono", ui-monospace, monospace;
    --display:"Bitroad", "Helvetica Neue", Helvetica, sans-serif;
    --vora:1.5px solid var(--esp); --ombra:3px 3px 0 var(--esp);
  }
  * { box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  body { margin:0; background:var(--butter); color:var(--esp); font-family:var(--sans); font-size:16px; line-height:1.5; }
  a { color:inherit; }
  a:focus-visible, button:focus-visible, textarea:focus-visible, input:focus-visible { outline:2px solid var(--ox); outline-offset:3px; }
  .mono { font-family:var(--mono); text-transform:uppercase; letter-spacing:.03em; }

  /* barra de dalt */
  .bar { display:grid; grid-template-columns:1.3fr 1fr 1fr; border-bottom:2px solid var(--esp);
         font-family:var(--mono); font-size:11px; letter-spacing:.02em; text-transform:uppercase; padding-top:env(safe-area-inset-top, 0px); }
  .bar > * { padding:12px 16px; border-right:1px solid var(--esp); text-decoration:none; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .bar > :last-child { border-right:0; text-align:right; }

  .wrap { max-width:1180px; margin:0 auto; padding:0 max(16px, env(safe-area-inset-left, 0px)) 48px; }

  /* capçalera: el nom seleccionat, com en un document */
  .hero { padding:34px 0 30px; }
  h1 { font-weight:700; font-size:clamp(52px, 15vw, 128px); line-height:.9; letter-spacing:-.045em; margin:0; }
  .sel { position:relative; background:var(--blue); padding:0 .06em; margin:0 -.02em; box-decoration-break:clone; -webkit-box-decoration-break:clone; }
  .sel::before, .sel::after { content:""; position:absolute; width:2px; background:var(--esp); top:-.06em; bottom:-.08em; }
  .sel::before { left:-1px; } .sel::after { right:-1px; }
  .cursor { position:absolute; right:-.42em; bottom:-.52em; width:.34em; height:auto; }
  .tooltip { position:absolute; right:.3em; top:calc(100% + 4px); white-space:nowrap; background:var(--esp); color:var(--butter);
             font-family:var(--mono); font-size:11px; letter-spacing:.03em; text-transform:uppercase; padding:5px 8px; border-radius:4px; }
  .lema { margin:34px 0 0; font-size:17px; line-height:1.4; color:var(--muted); max-width:30ch; }

  .sec { display:flex; justify-content:space-between; align-items:baseline; margin:36px 0 14px; padding-bottom:8px;
         border-bottom:2px solid var(--esp); font-family:var(--mono); font-weight:400; font-size:12px; text-transform:uppercase; letter-spacing:.03em; }

  /* les eines: finestretes, totes iguals */
  .graella { display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:14px 12px; }
  .eina { position:relative; display:flex; flex-direction:column; background:var(--paper); border:var(--vora); border-radius:10px; box-shadow:var(--ombra); overflow:hidden; }
  .barra { display:flex; align-items:center; gap:8px; padding:6px 8px; background:var(--blue-soft); border-bottom:var(--vora);
           font-family:var(--mono); font-size:10px; text-transform:uppercase; letter-spacing:.03em; }
  .punts { display:flex; gap:4px; }
  .punts i { width:8px; height:8px; border-radius:50%; border:1.2px solid var(--esp); background:var(--butter); }
  .punts i:first-child { background:var(--ox); }
  .punts i:nth-child(2) { background:var(--blue); }
  .barra .preu { margin-left:auto; }
  .visual { position:relative; display:block; aspect-ratio:1; overflow:hidden; border-bottom:var(--vora); background:var(--butter); }
  .capa { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; transition:transform .5s cubic-bezier(.16,1,.3,1); }
  .capa > img.foto { display:block; width:100%; height:100%; object-fit:cover; }
  @media (hover:hover) { .eina:not(.soon):hover .capa { transform:scale(1.04); } }
  .capa.fons { background-size:cover; background-position:center; }
  .capa.fons img { width:74%; height:auto; }
  .adhesiu { position:absolute; top:38px; right:-4px; z-index:1; transform:rotate(6deg); background:var(--ox); color:var(--butter);
             font-family:var(--mono); font-size:11px; text-transform:uppercase; letter-spacing:.04em; padding:5px 12px 5px 9px; border:var(--vora); }

  /* la prova d'animacions, dibuixada com la seva interfície */
  .capa.timeline { background:var(--esp); flex-direction:column; align-items:stretch; gap:12%; padding:12%; }
  .tl-pantalla { position:relative; aspect-ratio:16/10; border:1.5px solid rgba(251,246,209,.4); border-radius:6px; }
  .tl-sub { position:absolute; left:50%; bottom:14%; transform:translateX(-50%); background:var(--blue-soft); color:var(--esp);
            font-weight:700; font-size:clamp(10px, 2.6vw, 15px); padding:2px 7px; border-radius:3px; white-space:nowrap; }
  .tl-pista { position:relative; height:2px; background:rgba(251,246,209,.5); }
  .tl-pista i { position:absolute; top:50%; width:10px; height:10px; margin:-5px 0 0 -5px; transform:rotate(45deg); background:var(--blue); border:1.2px solid var(--butter); }
  .tl-pista b { position:absolute; top:-9px; bottom:-9px; width:2px; background:var(--butter); }

  .cos { display:flex; flex-direction:column; flex:1; padding:12px 12px 12px; }
  .cos h3 { font-size:17px; line-height:1.15; letter-spacing:-.02em; margin:0 0 5px; }
  .frase { margin:0; font-size:13.5px; line-height:1.4; color:var(--muted); }
  .fitxa { margin:10px 0 0; border-top:1px solid var(--esp); }
  .fitxa > div { display:flex; gap:8px; align-items:baseline; padding:5px 0; border-bottom:1px solid var(--esp); }
  .fitxa dt { flex:none; width:2.4em; font-family:var(--mono); font-size:10px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); }
  .fitxa dd { margin:0; font-size:13px; font-weight:700; line-height:1.25; min-width:0; }
  .accions { display:flex; flex-wrap:wrap; align-items:center; gap:8px 12px; margin-top:auto; padding-top:12px; }
  .btn { display:inline-flex; align-items:center; justify-content:space-between; gap:10px; min-height:44px; width:100%;
         background:var(--ox); color:var(--butter); text-decoration:none; font:700 15px/1.1 var(--sans); border:0;
         padding:10px 12px; border-radius:6px; cursor:pointer; transition:background .2s, transform .1s; }
  .btn:hover { background:#6a0a14; }
  .btn:active { transform:scale(.98); }
  .btn svg { flex:none; }
  .btn.clar { background:var(--paper); color:var(--esp); border:var(--vora); }
  .btn.clar:hover { background:var(--blue-soft); }
  .link { font-size:13px; text-underline-offset:3px; }

  /* aviat: difuminades */
  .eina.soon .visual { background:repeating-linear-gradient(-45deg, transparent 0 7px, rgba(47,27,17,.08) 7px 8px), var(--butter);
                       display:flex; align-items:flex-end; padding:12px; }
  .boira { filter:blur(5px); user-select:none; }
  .soon .visual h3 { font-family:var(--display); font-weight:400; font-size:clamp(22px, 6vw, 32px); line-height:.9; margin:0; }
  .soon .barra { background:var(--butter); }
  .eina.soon .visual { aspect-ratio:3/2; }

  /* bústia */
  .bustia { display:grid; gap:18px; }
  .paper { position:relative; background:var(--paper); border:var(--vora); border-radius:10px; box-shadow:var(--ombra); padding:18px 16px 16px;
           background-image:repeating-linear-gradient(transparent 0 31px, rgba(172,202,230,.55) 31px 32px); background-position:0 62px; }
  .paper label { display:block; font-weight:700; }
  .paper .q { font-size:22px; letter-spacing:-.02em; line-height:1.15; margin-bottom:10px; }
  .paper .petit { font-size:14px; margin:14px 0 6px; }
  .paper .petit span { font-weight:400; color:var(--muted); }
  .paper textarea, .paper input[type=text] { display:block; width:100%; font:16px/1.5 var(--sans); color:var(--esp); background:rgba(255,255,255,.6);
           border:var(--vora); border-radius:6px; padding:10px 12px; }
  .paper textarea { resize:vertical; min-height:112px; }
  .paper .btn { margin-top:14px; }
  .hp { position:absolute; left:-9999px; width:1px; height:1px; opacity:0; }
  .estat { min-height:1.4em; margin:10px 0 0; font-size:14px; }
  .escena { position:relative; height:215px; display:flex; align-items:flex-end; justify-content:center; }
  .escena .clip { position:absolute; left:0; right:0; top:0; height:var(--ranura, 132px); overflow:hidden; pointer-events:none; z-index:2; }
  .papereta { position:absolute; left:50%; top:0; width:92px; height:58px; margin-left:-46px; opacity:0; background:var(--paper); border:var(--vora); border-radius:3px;
              background-image:linear-gradient(135deg, transparent 49%, rgba(47,27,17,.35) 50%, transparent 51%); }
  .papereta::after { content:""; position:absolute; left:10px; right:10px; top:14px; height:14px;
                     background:repeating-linear-gradient(var(--blue) 0 2px, transparent 2px 7px); }
  .caixa { position:relative; width:200px; transform-origin:50% 100%; }
  .caixa svg { display:block; width:100%; height:auto; overflow:visible; }
  .bandereta { transform-box:view-box; transform-origin:180px 94px; transform:rotate(90deg); transition:transform .5s cubic-bezier(.34,1.56,.64,1) .1s; }
  .rebuda .bandereta { transform:rotate(0deg); }

  footer { max-width:1180px; margin:0 auto; padding:16px max(16px, env(safe-area-inset-left, 0px)) calc(32px + env(safe-area-inset-bottom, 0px));
           border-top:2px solid var(--esp); display:flex; justify-content:space-between; font-family:var(--mono); font-size:11px; text-transform:uppercase; }
  footer a { text-decoration:none; }

  @media (min-width: 640px) {
    .graella { grid-template-columns:repeat(3, minmax(0, 1fr)); gap:18px; }
    .bustia { grid-template-columns:minmax(0, 1.2fr) minmax(0, 1fr); align-items:end; }
  }
  @media (min-width: 760px) {
    .wrap { padding-left:32px; padding-right:32px; }
    footer { max-width:1116px; width:calc(100% - 64px); padding-left:0; padding-right:0; }
    .hero { padding:56px 0 44px; }
    .tooltip { font-size:12px; }
  }
  @media (min-width: 980px) {
    .graella { grid-template-columns:repeat(4, minmax(0, 1fr)); }
  }

  @media (prefers-reduced-motion: no-preference) {
    .js .reveal { opacity:0; transform:translateY(12px); transition:opacity .6s cubic-bezier(.16,1,.3,1), transform .6s cubic-bezier(.16,1,.3,1);
                  transition-delay:calc(var(--i, 0) * 70ms); }
    .js .reveal.in { opacity:1; transform:none; }
  }
</style>
</head>
<body>
<header class="bar">
  <a id="insta" href="#">@ivetanoro</a>
  <span id="compte"></span>
  <span id="data"></span>
</header>
<main class="wrap">
  <section class="hero">
    <h1 id="nom"></h1>
    <p class="lema" id="lema"></p>
  </section>

  <h2 class="sec"><span>eines</span><span id="rang"></span></h2>
  <div class="graella" id="eines"></div>

  <h2 class="sec"><span>aviat</span><span>a punt de sortir</span></h2>
  <div class="graella" id="aviat"></div>

  <div id="seccio-bustia" hidden>
    <h2 class="sec"><span>bústia</span><span>demana una eina</span></h2>
    <div class="bustia">
      <form class="paper" id="peticio" novalidate>
        <label class="q" for="idea">quina eina t’aniria bé?</label>
        <textarea id="idea" name="idea" maxlength="1000" required placeholder="una que em digui…"></textarea>
        <label class="petit" for="qui">el teu @ o el teu nom <span>(si vols que et respongui)</span></label>
        <input type="text" id="qui" name="qui" maxlength="80" autocomplete="off">
        <input type="checkbox" name="botcheck" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
        <button class="btn" type="submit"><span>tira-la a la bústia</span><svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true"><path d="M9 3v11M4.5 10 9 14.5 13.5 10" stroke="currentColor" stroke-width="2"/></svg></button>
        <p class="estat" id="estat" role="status" aria-live="polite"></p>
      </form>
      <div class="escena" aria-hidden="true">
        <div class="clip"><div class="papereta" id="papereta"></div></div>
        <div class="caixa" id="caixa">
          <svg viewBox="0 0 200 170" fill="none">
            <rect x="18" y="104" width="10" height="64" fill="#2F1B11"/><rect x="152" y="104" width="10" height="64" fill="#2F1B11"/>
            <rect x="8" y="22" width="168" height="98" rx="16" fill="#4C050C" stroke="#2F1B11" stroke-width="3"/>
            <rect x="46" y="36" width="92" height="12" rx="6" fill="#2F1B11"/>
            <rect x="40" y="66" width="104" height="34" rx="4" fill="#FBF6D1" stroke="#2F1B11" stroke-width="2"/>
            <text x="92" y="88" text-anchor="middle" font-family="BitroadMono, monospace" font-size="13" fill="#2F1B11">PETICIONS</text>
            <g class="bandereta"><rect x="178" y="46" width="4" height="50" fill="#2F1B11"/><rect x="182" y="46" width="20" height="14" fill="#ACCAE6" stroke="#2F1B11" stroke-width="2"/></g>
          </svg>
        </div>
      </div>
    </div>
  </div>
</main>
<footer><a id="insta2" href="#">@ivetanoro</a><span id="peu"></span></footer>

<script src="cataleg.js"></script>
<script>
document.documentElement.classList.add("js");
const P = window.PARADETA, EINES = window.EINES, AVIAT = window.AVIAT;
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
const n2 = i => String(i).padStart(2, "0");
const fletxa = `<svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true"><path d="M3 9h11M10 4.5 14.5 9 10 13.5" stroke="currentColor" stroke-width="2"/></svg>`;
const quiet = matchMedia("(prefers-reduced-motion: reduce)").matches;

// capçalera: l'última paraula del nom, seleccionada amb el cursor a sobre
const paraules = P.nom.split(" "), darrera = paraules.pop();
document.getElementById("nom").innerHTML = `${esc(paraules.join(" "))} <span class="sel">${esc(darrera)}`
  + `<svg class="cursor" viewBox="0 0 24 34" aria-hidden="true"><path d="M2 2v26l7-6 5 10 5-2-5-10h9z" fill="#FFFDF2" stroke="#2F1B11" stroke-width="2" stroke-linejoin="round"/></svg>`
  + `<span class="tooltip">${n2(EINES.length)} eines · ${n2(AVIAT.length)} aviat</span></span>`;
document.getElementById("lema").textContent = P.lema;
document.getElementById("compte").textContent = `${n2(EINES.length)} eines`;
document.getElementById("data").textContent = P.actualitzat;
document.getElementById("peu").textContent = `${P.nom} · ${new Date().getFullYear()}`;
for (const id of ["insta", "insta2"]) document.getElementById(id).href = P.instagram;
document.getElementById("rang").textContent = `01–${n2(EINES.length)}`;

const barra = (num, dreta) => `<div class="barra"><span class="punts"><i></i><i></i><i></i></span><span>${esc(num)}</span><span class="preu">${esc(dreta)}</span></div>`;
const visual = (v, url) => {
  let capa = "";
  if (v.imatge) capa = `<div class="capa"><img class="foto" src="${esc(v.imatge)}" alt="" loading="lazy" width="900" height="900"></div>`;
  else if (v.fons) capa = `<div class="capa fons" style="background-image:url('${esc(v.fons)}')">${v.logo ? `<img src="${esc(v.logo)}" alt="">` : ""}</div>`;
  else if (v.ui === "timeline") capa = `<div class="capa timeline"><div class="tl-pantalla"><span class="tl-sub">i aquí, un zoom</span></div>`
    + `<div class="tl-pista"><i style="left:14%"></i><i style="left:41%"></i><b style="left:58%"></b><i style="left:79%"></i></div></div>`;
  return `<a class="visual" href="${esc(url)}" tabindex="-1" aria-hidden="true">${capa}</a>`;
};
const accions = e => {
  const b = [];
  if (e.preu && e.stripe) b.push(`<a class="btn" href="${esc(e.stripe)}"><span>compra-la · ${esc(e.preu)}</span>${fletxa}</a>`);
  b.push(`<a class="btn${e.preu && e.stripe ? " clar" : ""}" href="${esc(e.boto.url)}"><span>${esc(e.boto.text)}</span>${fletxa}</a>`);
  if (e.enllac2) b.push(`<a class="link" href="${esc(e.enllac2.url)}">${esc(e.enllac2.text)}</a>`);
  return `<div class="accions">${b.join("")}</div>`;
};

document.getElementById("eines").innerHTML = EINES.map((e, i) => `
  <article class="eina reveal" style="--i:${i}">
    ${barra(n2(i + 1), e.preu || "gratis")}
    ${visual(e.visual || {}, e.boto.url)}
    ${e.etiqueta ? `<span class="adhesiu">${esc(e.etiqueta)}</span>` : ""}
    <div class="cos">
      <h3>${esc(e.titol)}</h3>
      <p class="frase">${esc(e.frase)}</p>
      <dl class="fitxa">${(e.fitxa || []).map(([k, v]) => `<div><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join("")}</dl>
      ${accions(e)}
    </div>
  </article>`).join("");

document.getElementById("aviat").innerHTML = AVIAT.map((a, i) => `
  <article class="eina soon reveal" style="--i:${i}">
    ${barra("aviat", "")}
    <div class="visual"><h3 class="boira">${esc(a.titol)}</h3></div>
    <div class="cos">
      <p class="frase boira">${esc(a.frase)}</p>
      ${a.llista ? `<div class="accions"><a class="btn clar" href="${esc(a.llista.url)}"><span>${esc(a.llista.text)}</span>${fletxa}</a></div>` : ""}
    </div>
  </article>`).join("");

if ("IntersectionObserver" in window) {
  const io = new IntersectionObserver(es => es.forEach(x => { if (x.isIntersecting) { x.target.classList.add("in"); io.unobserve(x.target); } }), { rootMargin:"0px 0px -6% 0px" });
  document.querySelectorAll(".reveal").forEach(el => io.observe(el));
} else document.querySelectorAll(".reveal").forEach(el => el.classList.add("in"));

// ---------- bústia: la petició s'envia amb Web3Forms (al codi només hi ha la clau, no el correu) ----------
const CLAU = (P.bustia && P.bustia.clau) || "";
const LOCAL = /^(127\.0\.0\.1|localhost)$/.test(location.hostname);
if (CLAU || LOCAL) {
  document.getElementById("seccio-bustia").hidden = false;
  const form = document.getElementById("peticio"), estat = document.getElementById("estat");
  const papereta = document.getElementById("papereta"), caixa = document.getElementById("caixa"), escena = caixa.parentElement;
  const boto = form.querySelector("button");

  const tiraLa = async () => {
    if (quiet || !papereta.animate) return;
    // la ranura és a 42/170 de l'alçada de la bústia: la papereta s'hi amaga
    const cr = caixa.getBoundingClientRect(), er = escena.getBoundingClientRect();
    const ranura = cr.top - er.top + cr.height * 42 / 170;
    escena.style.setProperty("--ranura", `${ranura}px`);
    await papereta.animate([
      { opacity:0, transform:"translateY(-10px) rotate(-14deg) scale(1.5)" },
      { opacity:1, transform:"translateY(0) rotate(-4deg) scale(1)" },
    ], { duration:380, easing:"cubic-bezier(.16,1,.3,1)", fill:"forwards" }).finished;
    await papereta.animate([
      { opacity:1, transform:"translateY(0) rotate(-4deg)" },
      { opacity:1, transform:`translateY(${ranura - 6}px) rotate(0deg)`, offset:.55 },
      { opacity:1, transform:`translateY(${ranura + 70}px) rotate(0deg)` },
    ], { duration:620, easing:"cubic-bezier(.55,0,.75,.4)", fill:"forwards" }).finished;
    papereta.style.opacity = 0;
    caixa.animate([
      { transform:"scale(1,1)" }, { transform:"scale(1.06,.94)" }, { transform:"scale(.98,1.03)" }, { transform:"scale(1,1)" },
    ], { duration:420, easing:"ease-out" });
    escena.classList.add("rebuda");
  };

  form.addEventListener("submit", async ev => {
    ev.preventDefault();
    const idea = form.idea.value.trim();
    if (!idea) { estat.textContent = "escriu quina eina t’aniria bé."; form.idea.focus(); return; }
    if (form.botcheck.checked) return;
    boto.disabled = true; estat.textContent = "";
    escena.classList.remove("rebuda");
    const enviament = CLAU
      ? fetch("https://api.web3forms.com/submit", {
          method:"POST", headers:{ "Content-Type":"application/json", Accept:"application/json" },
          body:JSON.stringify({ access_key:CLAU, subject:"Petició d’eina a la paradeta", from_name:"la paradeta",
                                idea, qui:form.qui.value.trim() || "(sense nom)", botcheck:false }),
        }).then(r => r.json()).then(j => { if (!j.success) throw new Error(j.message || "error"); })
      : Promise.resolve("prova");
    const [res] = await Promise.allSettled([enviament, tiraLa()]);
    boto.disabled = false;
    if (res.status === "fulfilled") {
      form.reset();
      estat.textContent = res.value === "prova" ? "a la bústia! (prova en local: no s’ha enviat)" : "a la bústia! la llegiré jo mateixa.";
    } else {
      escena.classList.remove("rebuda");
      estat.textContent = "no s’ha pogut enviar. torna-ho a provar d’aquí a una estona.";
    }
  });
}
</script>
</body>
</html>
